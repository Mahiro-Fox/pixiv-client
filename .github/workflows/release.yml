name: Release

# 推送形如 v0.1.0 的 tag 时触发。
# 注意：tag 必须与 desktop/package.json 的 version 一致，
# electron-builder 会用 package.json 的版本号决定上传到哪个 Release。
on:
  push:
    tags:
      - 'v*'

# electron-builder 需要写权限才能创建 Release 并上传安装包
permissions:
  contents: write

# 同一个 tag 同一时间只跑一个发布任务。
# GitHub 允许同一个 tag 存在多个 Release，如果两个任务并发执行，
# 它们会各自查不到已存在的 Release 而各创建一个，出现重复 Release。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 发布前检查该 tag 是否已有 Release，已有则整体跳过，避免重复创建
  guard:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $GITHUB_REF_NAME 已存在，跳过本次发布"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: guard
    # 需要重新发布同一个 tag 时，先在 GitHub 上删掉旧 Release 再重跑本工作流
    if: needs.guard.outputs.exists == 'false'
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # npm ci 会执行 ffmpeg-static 的 postinstall，从网络拉取随包的 ffmpeg.exe
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # dist:publish = build + electron-builder --publish always
      # electron-builder.yml 里的 publish 指向本仓库，GITHUB_TOKEN 由 Actions 注入
      - name: Build and publish
        run: npm run dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
