<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: pixivfile: https://i.pximg.net https://*.pximg.net; connect-src 'self' ws: http: https:; font-src 'self' data:;"
    />
    <title>Pixiv Client</title>
    <script>
      // 首屏前按上次选择设置主题，避免加载配置期间闪白
      ;(function () {
        try {
          var mode = localStorage.getItem('pixiv-theme') || 'dark'
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (error) {
          /* 读不到本地存储时沿用 html 上的 dark 默认值 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
