appId: com.pixiv.desktop
productName: Pixiv 下载器

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json

# ffmpeg 是随包的可执行文件，必须解包到 asar 外才能运行。
# spawn 一个 asar 内的文件在 Windows 上会直接失败（无真实路径）。
asarUnpack:
  - node_modules/ffmpeg-static/**

# 仅 Windows：NSIS 安装包。Release 下载链接里避免中文文件名，
# 所以 artifactName 用 ASCII，界面显示名仍是 productName。
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: pixiv-client-${version}-setup.${ext}

nsis:
  # 让用户可选安装位置，并且装到用户目录（不需要管理员权限）
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Pixiv 下载器
  # 安装向导默认简体中文，同时保留英文
  installerLanguages:
    - zh_CN
    - en_US
  language: '2052'
  # 卸载时保留用户已下载的作品与配置，避免误删数据
  deleteAppDataOnUninstall: false
  artifactName: pixiv-client-${version}-setup.${ext}

# 发布到 GitHub Releases；由 CI 通过 `electron-builder --publish always` 触发。
# releaseType 用 release 而非默认的 draft，打 tag 即自动发布。
publish:
  provider: github
  owner: Mahiro-Fox
  repo: pixiv-client
  releaseType: release